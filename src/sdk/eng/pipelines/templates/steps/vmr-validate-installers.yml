parameters:
- name: continueOnError
  type: boolean
  default: false

- name: testRpmPackages
  type: boolean
  default: true

- name: testDebPackages
  type: boolean
  default: true

- name: OS
  type: string
  values:
    - Windows_NT
    - Linux
    - Darwin

variables:
- name: osSpecificTestProperties
  ${{ if eq(parameters.OS, 'Linux') }}:
    value: /p:TestRpmPackages=${{ parameters.testRpmPackages }} /p:TestDebPackages=${{ parameters.testDebPackages }}
  ${{ else }}:
    value: ''
- name: testProperties
  value: $(osSpecificTestProperties) /p:BlobArtifactsDir=$(Build.ArtifactStagingDirectory)/BlobArtifacts /p:PackageArtifactsDir=$(Build.ArtifactStagingDirectory)/PackageArtifacts

steps:
- task: DownloadBuildArtifacts@1
  inputs:
    artifactName: BlobArtifacts
    downloadPath: $(Build.ArtifactStagingDirectory)
    checkDownloadedFiles: true
  displayName: Download Blob Artifacts

- task: DownloadBuildArtifacts@1
  inputs:
    artifactName: PackageArtifacts
    downloadPath: $(Build.ArtifactStagingDirectory)
    checkDownloadedFiles: true
  displayName: Download Package Artifacts

# This is necessary whenever we want to publish/restore to an AzDO private feed
# Since sdk-task.ps1 tries to restore packages we need to do this authentication here
# otherwise it'll complain about accessing a private feed.
- task: NuGetAuthenticate@1
  displayName: 'Authenticate to AzDO Feeds'

- ${{ if eq(parameters.OS, 'Linux') }}:
  - template: vmr-build.yml
    parameters:
      runBuild: false
      sourcesPath: $(Build.SourcesDirectory)
      testProject: test/Microsoft.DotNet.Installer.Tests/Microsoft.DotNet.Installer.Tests.csproj
      extraProperties: $(testProperties)

  - task: PublishTestResults@2
    displayName: Publish Test Results
    condition: succeededOrFailed()
    continueOnError: true
    inputs:
      testRunner: VSTest
      testResultsFiles: 'artifacts/TestResults/Release/*.trx'
      searchFolder: $(Build.SourcesDirectory)
      mergeTestResults: true
      publishRunAttachments: true
      testRunTitle: Tests_$(Agent.JobName)
